name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # Required for OIDC
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup
        with:
          registry-url: "https://registry.npmjs.org"

      # changesets/action only publishes (and so runs the browser tests in
      # `npm run release`) when there are no pending changesets
      - name: Check for pending changesets
        id: pending
        run: |
          if find .changeset -name '*.md' ! -name 'README.md' | grep -q .; then
            echo "changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.pending.outputs.changesets == 'false'
        uses: ./.github/actions/playwright

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          # Builds, tests and calls changeset publish
          publish: npm run release
          version: npm run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
