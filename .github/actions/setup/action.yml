name: Setup
description: Set up Node from .nvmrc and install dependencies from the lockfile

inputs:
  registry-url:
    description: Registry for publishing, passed to actions/setup-node
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: npm
        registry-url: ${{ inputs.registry-url }}

    - name: Install Dependencies
      shell: bash
      run: npm ci
